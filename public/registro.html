<script>
    if(sessionStorage.NOME_USUARIO == undefined){
        alert("Por favor se cadastre!")
        window.location = "login.html";
    }

    function enviarSair(){
        enviar(false)
        window.location = "dashboard.html";
    }

    function verificar(){
        let nome = input_nome.value;
        let eficiencia = input_eficiencia.value;
        let complexidade = input_complexidade.value;
        let tipo = input_tipo.value;
        let descricao = input_descricao.value;
        console.log(nome)
        console.log(eficiencia)
        console.log(complexidade)
        console.log(tipo)
        console.log(descricao)

        if(nome == '' || eficiencia == '' || complexidade == '' || tipo == '' || descricao == ''){
            aaEE.innerHTML = "Preencha todos os campos!"
        } else {
            enviar(true)
        }
    }

    function enviar(d){
        let nome = input_nome.value;
        let eficiencia = input_eficiencia.value;
        let complexidade = input_complexidade.value;
        let tipo = (input_tipo.value == 'arquitetonico');
        let descricao = input_descricao.value;
        if(d){
            input_nome.value = ''; 
            input_eficiencia.value = '';
            input_complexidade.value = '';
            input_tipo.value = '';
            input_descricao.value = '';
            }

     fetch("/registro/registrar", {
        method: "POST", 
        headers: {
            "Content-Type": "application/json",
        },
        body: JSON.stringify({
            idUsuarioServer: sessionStorage.ID_USUARIO,
            nomeServer: nome,
            eficienciaServer: eficiencia,
            complexidadeServer: complexidade,
            tipoServer: tipo,
            descricaoServer: descricao
        })
    })
    }
</script>
