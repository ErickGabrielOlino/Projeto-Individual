<script>
    let caracteres_especiais = ["!", "#", "$", "%" ,"&", "'", "(", ")", "*", "+", ",", "-", ".", "/", ":", ";" ,"<", "=", ">", "?", "@", "^", "_", "~"];

    function cadastrar(){
        
        let nome = input_nome.value;
        let email = input_email.value;
        let senha = input_senha.value;
        let caracter = false;

        for(let i = 0; i < senha.length; i++){
            if (caracter == true){
                break;
            }
            for(let j = 0; j < caracteres_especiais.length; j++){
                if(senha[i] == caracteres_especiais[j]) {
                    caracter = true;
                }
             }
        }

        if(nome.length < 3){
            menEr1.innerHTML = "Seu nome deve ter pelo menos 3 caracteres*";
            console.log("Seu nome deve ter pelo menos 3 caracteres!")
        } else if (senha.length < 8) {
             menEr3.innerHTML = "Sua senha deve ter ao menos 8 caracteres*";
            console.log("Sua senha deve ter ao menos 8 caracteres!")
        } else if (senha.toUpperCase() == senha || senha.toUpperCase() == senha) {
            menEr3.innerHTML = "Sua senha deve conter letras maisculas e minusculas*";
            console.log("Sua senha deve conter letras maisculas e minusculas!")
        } else if (caracter == false) {
             menEr3.innerHTML = "Sua senha deve conter ao menos um caractere especial*";
            console.log("Sua senha deve conter ao menos um caractere especial!")
        } else {

    
       fetch("/cadastro/cadastrar", {
        method: "POST", 
        headers: {
            "Content-Type": "application/json",
        },
        body: JSON.stringify({
            nomeServer: nome,
            emailServer: email,
            senhaServer: senha
        })
    }).then(function (resposta){
            window.location = "login.html";
        })
       
        }
    }

    function ver(e){
        if (e.type == "password"){
            e.type = "text";
        } else {
            e.type = "password"
        }
        
    }
</script>
